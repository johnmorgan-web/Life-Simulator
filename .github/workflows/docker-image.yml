name: docker-image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: Deploy newly built image to VPS
        required: true
        default: false
        type: boolean
      vps_app_dir:
        description: VPS directory containing docker-compose.prod.yml
        required: true
        default: ~/life-simulator
        type: string
      compose_file:
        description: Docker Compose file name on VPS
        required: true
        default: docker-compose.prod.yml
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps }}

    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_U }}
          password: ${{ secrets.SSH_P }}
          port: ${{ secrets.SSH_PT }}
          script_stop: true
          script: |
            set -e
            TARGET_DIR="${{ inputs.vps_app_dir }}"
            TARGET_DIR="${TARGET_DIR/#\~/$HOME}"
            cd "$TARGET_DIR"
            docker compose -f "${{ inputs.compose_file }}" pull
            docker compose -f "${{ inputs.compose_file }}" up -d --remove-orphans