name: docker-image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: Deploy newly built image to VPS
        required: true
        default: false
        type: boolean
      vps_app_dir:
        description: VPS directory containing docker-compose.prod.yml
        required: true
        default: ~/life-simulator
        type: string
      compose_file:
        description: Docker Compose file name on VPS
        required: true
        default: docker-compose.prod.yml
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package semantic-release@25 \
            --package @semantic-release/commit-analyzer \
            --package @semantic-release/release-notes-generator \
            --package @semantic-release/github \
            semantic-release

  build-and-push:
    needs: [release]
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve semantic version tag on HEAD
        id: semver
        shell: bash
        run: |
          set -e
          git fetch --force --tags
          SEMVER_TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | head -n 1 || true)"
          if [[ -n "$SEMVER_TAG" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$SEMVER_TAG" >> "$GITHUB_OUTPUT"
            echo "Found semantic tag on HEAD: $SEMVER_TAG"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No semantic tag found on HEAD"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.semver.outputs.tag }},enable=${{ steps.semver.outputs.found == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    needs: [release, build-and-push]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.build-and-push.result == 'success' }}

    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_U }}
          password: ${{ secrets.SSH_P }}
          port: ${{ secrets.SSH_PT }}
          script_stop: true
          script: |
            set -e
            TARGET_DIR="${{ inputs.vps_app_dir }}"
            TARGET_DIR="${TARGET_DIR/#\~/$HOME}"
            cd "$TARGET_DIR"
            docker compose -f "${{ inputs.compose_file }}" pull
            docker compose -f "${{ inputs.compose_file }}" up -d --remove-orphans