services:
  life-simulator:
    image: ghcr.io/johnmorgan-web/life-simulator:latest
    container_name: life-simulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      SQLITE_DB_PATH: /app/data/life-simulator.sqlite
      NODE_OPTIONS: --max-old-space-size=400
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ./data:/app/data